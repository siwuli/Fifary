<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  /* 深浅色只认 App 里设的主题（RichBody 往 html 上写 data-theme），
     别让 WebView 再自作主张反色，不然黑底黑字谁也看不清 */
  :root {
    --fg: #1b1b1f; --ph: rgba(0, 0, 0, .3); --muted: #666; --line: #e2e2e6;
    --code-bg: #f2f2f4; --player-bg: #f4f4f6; --player-bar: #dcdce2;
    --quote: #d9c07a; --mark: #ffe9a8; --accent: #2f6bff;
  }
  html[data-theme="dark"] {
    --fg: #e9eaec; --ph: rgba(255, 255, 255, .32); --muted: #a4a8b0; --line: #2e3136;
    --code-bg: #24272b; --player-bg: #24272b; --player-bar: #3a3d43;
    --quote: #c9ad6a; --mark: #5a4a1e; --accent: #7aa7ff;
  }
  html, body { margin: 0; padding: 0; }
  body {
    padding: 4px 20px 120px 20px;
    font-family: -apple-system, "Noto Sans CJK SC", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--fg);
    -webkit-user-select: text;
    outline: none;
    word-break: break-word;
  }
  /* 行高显式给到每个块：光靠 body 的 font 简写，WebView 画光标时会用另一套行高，跟文字错开 */
  h1, h2, h3, p, blockquote, li, div, ul, ol { line-height: 1.65; }
  /* 第一行就是标题位：空着就给灰提示（占位色 rgba(0,0,0,.3)、不带粗体），
     提示绝对定位，光标才不会被顶到提示文字后面 */
  body > .ph { position: relative; }
  body > .ph::before { content: "标题"; position: absolute; left: 0; top: 0; color: var(--ph); font-weight: 400; }
  h1 { font-size: 24px; font-weight: 600; margin: 14px 0 6px; }
  h2 { font-size: 20px; font-weight: 600; margin: 13px 0 6px; }
  h3 { font-size: 16px; font-weight: 600; margin: 12px 0 6px; }
  p { margin: 6px 0; }
  blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--quote); color: var(--muted); font-size: 14px; }
  code { font-family: monospace; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
  img { max-width: 100%; border-radius: 12px; margin: 8px 0; }
  hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  ul, ol { margin: 6px 0; padding-left: 24px; }
  li { margin: 2px 0; }
  a { color: var(--accent); }
  .player { display: inline-flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; margin: 6px 0; padding: 8px 12px; background: var(--player-bg); border-radius: 14px; vertical-align: middle; -webkit-user-select: none; user-select: none; }
  .player .pp { flex: none; width: 32px; height: 32px; line-height: 32px; text-align: center; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; }
  .player .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--player-bar); overflow: hidden; }
  .player .fill { display: block; height: 100%; width: 0; background: var(--accent); }
  .player .t { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  mark { background: var(--mark); }
  ul.todo { list-style: none; padding-left: 0; }
  /* 勾选框绝对定位、正文按普通行排：flex 里空的 .t 会塌成 0 宽，光标被画到行首（框左边）。
     em 要跟着这一行的字号走（标题大小的待办，框和位置一起放大），所以宽高和 top 都用 em，
     并且 input 得显式 inherit 字号——表单控件默认不继承，框会一直卡在正文尺寸上 */
  ul.todo > li { position: relative; padding-left: 1.625em; }
  ul.todo > li > input { position: absolute; left: 0; top: 0.325em; width: 1em; height: 1em; margin: 0; font-size: inherit; accent-color: var(--accent); }
  ul.todo > li[data-done="1"] > .t { color: var(--muted); text-decoration: line-through; }
</style>
</head>
<body contenteditable="true" spellcheck="false"></body>
<script>
function inline(s) {
  var keep = [];
  s = s.replace(/<(\/?)(u|mark|sub|sup|span)(\s[^>]*)?>/gi, function (m) {
    keep.push(m);
    return '\u0001' + (keep.length - 1) + '\u0001';
  });
  s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  s = s
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, src) { return '<img src="' + src + '" alt="' + alt + '">'; })
    .replace(/\[([^\]]+)\]\(([^)\s]+\.(?:m4a|mp3|aac|wav|ogg))\)/gi, function (m, t, src) { return playerHtml(src, t); })
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, href) { return '<a href="' + href + '">' + t + '</a>'; })
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  return s.replace(/\u0001(\d+)\u0001/g, function (m, i) { return keep[+i]; });
}

function todoRun(L, cur) {
  var out = '<ul class="todo">';
  while (cur.i < L.length) {
    var m = L[cur.i].trim().match(/^[-*]\s+\[([ xX])\]\s*(.*)$/);
    if (!m) break;
    var done = /x/i.test(m[1]);
    out += '<li data-done="' + (done ? 1 : 0) + '"><input type="checkbox" contenteditable="false"' +
      (done ? ' checked' : '') + '><span class="t">' + inline(m[2]) + '</span></li>';
    cur.i++;
  }
  return out + '</ul>';
}

function listRun(L, cur) {
  var out = '', stack = [];
  function closeOne() { var e = stack.pop(); out += '</li></' + e.tag + '>'; }
  while (cur.i < L.length) {
    var raw = L[cur.i], t = raw.trim();
    if (t === '') { cur.i++; continue; }
    // 只有标记没有内容也算一项（回车新起的那一行），不然它会变成正文里一个「-」
    var m = t.match(/^([-*+]|\d+\.)(?:\s+(.*))?$/);
    if (!m) break;
    var ind = raw.length - raw.replace(/^[ \t]+/, '').length;
    var tag = /^\d+\.$/.test(m[1]) ? 'ol' : 'ul';
    if (!stack.length) {
      stack.push({ tag: tag, ind: ind });
      out += '<' + tag + '>';
    } else {
      var top = stack[stack.length - 1];
      if (ind > top.ind) {
        stack.push({ tag: tag, ind: ind });
        out += '<' + tag + '>';
      } else if (ind < top.ind) {
        while (stack.length > 1 && ind < stack[stack.length - 1].ind) closeOne();
        out += '</li>';
      } else if (tag !== top.tag) {
        closeOne();
        stack.push({ tag: tag, ind: ind });
        out += '<' + tag + '>';
      } else {
        out += '</li>';
      }
    }
    out += '<li>' + inline(m[2] || '');
    cur.i++;
  }
  while (stack.length) closeOne();
  return out;
}

function mdToHtml(md) {
  var L = (md || '').replace(/\r/g, '').split('\n'), out = [], cur = { i: 0 };
  // 文件末尾那一个换行不是空行，别读成"最后多一个空段落"
  while (L.length && L[L.length - 1].trim() === '') L.pop();
  while (cur.i < L.length) {
    var t = L[cur.i].trim();
    if (t === '') {
      // 空行就是一个空段落：一行一个段落，回车敲出来的间隔就靠它留着
      out.push('<p><br></p>');
      cur.i++;
      continue;
    }
    if (/^<(div|p|h1|h2|h3|ul|ol|blockquote|hr|img|table)\b/i.test(t)) { out.push(t); cur.i++; continue; }
    if (t === '---') { out.push('<hr>'); cur.i++; continue; }
    var h = t.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      var lv = h[1].length;
      out.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>');
      cur.i++;
      continue;
    }
    if (/^>\s?/.test(t)) { out.push('<blockquote>' + inline(t.replace(/^>\s?/, '')) + '</blockquote>'); cur.i++; continue; }
    if (/^[-*]\s+\[[ xX]\]\s*/.test(t)) { out.push(todoRun(L, cur)); continue; }
    if (/^([-*+]|\d+\.)(\s+.*)?$/.test(t)) { out.push(listRun(L, cur)); continue; }
    out.push('<p>' + inline(t) + '</p>');
    cur.i++;
  }
  return out.join('');
}

function fmt(open, close, n) {
  var inner = ser(n);
  return inner ? open + inner + close : '';
}

function ser(node) {
  var s = '';
  for (var i = 0; i < node.childNodes.length; i++) {
    var n = node.childNodes[i];
    if (n.nodeType === 3) { s += n.nodeValue; continue; }
    if (n.nodeType !== 1) continue;
    var tag = n.nodeName;
    if (tag === 'INPUT') continue;
    if (tag === 'B' || tag === 'STRONG') s += fmt('**', '**', n);
    else if (tag === 'I' || tag === 'EM') s += fmt('*', '*', n);
    else if (tag === 'S' || tag === 'STRIKE' || tag === 'DEL') s += fmt('~~', '~~', n);
    else if (tag === 'CODE') s += fmt('`', '`', n);
    else if (tag === 'U') s += fmt('<u>', '</u>', n);
    else if (tag === 'MARK') s += fmt('<mark>', '</mark>', n);
    else if (tag === 'A') s += '[' + ser(n) + '](' + n.getAttribute('href') + ')';
    else if (tag === 'IMG') s += '![](' + n.getAttribute('src') + ')';
    else if (tag === 'BR') s += '\n';
    else if (tag === 'SPAN' && n.className.indexOf('player') >= 0) {
      s += '[' + n.getAttribute('data-label') + '](' + n.getAttribute('data-src') + ')';
    } else if (tag === 'SPAN' && n.getAttribute('style')) {
      s += '<span style="' + n.getAttribute('style') + '">' + ser(n) + '</span>';
    } else s += ser(n);
  }
  return s;
}

function clean(x) { return x.replace(/\u00a0/g, ' ').trim(); }

function clock(s) {
  if (!isFinite(s)) s = 0;
  var m = Math.floor(s / 60), r = Math.floor(s % 60);
  return m + ':' + (r < 10 ? '0' : '') + r;
}

// 录音在正文里就是播放器：播放/暂停 + 进度条 + 时长，点进度条能拖
function playerHtml(src, label) {
  return '<span class="player" contenteditable="false" data-src="' + src + '" data-label="' + label + '">' +
    '<span class="pp">▶</span><span class="bar"><span class="fill"></span></span>' +
    '<span class="t">' + label + '</span></span>';
}

document.addEventListener('click', function (e) {
  var d = e.target.closest ? e.target.closest('.player') : null;
  if (!d) return;
  e.preventDefault();
  if (!d.audio) {
    var a = new Audio(d.getAttribute('data-src'));
    d.audio = a;
    var fill = d.querySelector('.fill'), t = d.querySelector('.t');
    a.addEventListener('loadedmetadata', function () { t.textContent = '0:00 / ' + clock(a.duration); });
    a.addEventListener('timeupdate', function () {
      fill.style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + '%';
      t.textContent = clock(a.currentTime) + ' / ' + clock(a.duration);
    });
    a.addEventListener('ended', function () {
      d.querySelector('.pp').textContent = '▶';
      fill.style.width = '0%';
      t.textContent = d.getAttribute('data-label');
    });
  }
  var au = d.audio;
  if (e.target.closest('.bar')) {
    var r = d.querySelector('.bar').getBoundingClientRect();
    if (au.duration) au.currentTime = au.duration * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    return;
  }
  if (au.paused) { au.play(); d.querySelector('.pp').textContent = '⏸'; }
  else { au.pause(); d.querySelector('.pp').textContent = '▶'; }
});

function listMd(el, depth, ordered) {
  var pad = '', lines = [];
  for (var d = 0; d < depth; d++) pad += '  ';
  for (var i = 0; i < el.children.length; i++) {
    var li = el.children[i], sub = null, buf = '';
    for (var j = 0; j < li.childNodes.length; j++) {
      var c = li.childNodes[j];
      if (c.nodeType === 1 && /^(UL|OL)$/.test(c.nodeName)) { sub = c; continue; }
      buf += ser({ childNodes: [c] });
    }
    lines.push(pad + (ordered ? (i + 1) + '. ' : '- ') + clean(buf));
    if (sub) lines = lines.concat(listMd(sub, depth + 1, sub.nodeName === 'OL'));
  }
  return lines;
}

// 勾选状态只是 DOM 属性，存盘/存历史前先写回 checked 属性，不然一存就丢
function syncBoxes() {
  var boxes = document.querySelectorAll('ul.todo input[type=checkbox]');
  for (var b = 0; b < boxes.length; b++) {
    if (boxes[b].checked) boxes[b].setAttribute('checked', '');
    else boxes[b].removeAttribute('checked');
  }
}

function htmlToMd() {
  wrapBare();
  syncBoxes();
  var lines = [], kids = document.body.children;
  for (var i = 0; i < kids.length; i++) {
    var el = kids[i];
    if (!el || el.nodeName === 'INPUT' || el.nodeName === 'BR') continue;
    var tag = el.nodeName;
    if (tag === 'HR') { lines.push('---'); continue; }
    if (tag === 'IMG') { lines.push('![](' + el.getAttribute('src') + ')'); continue; }
    if (tag === 'UL' || tag === 'OL') {
      // 列表项上的缩进/字号 markdown 没有对应写法，整张列表按 HTML 存，不然一存就丢
      var styled = !!el.getAttribute('style');
      for (var k = 0; k < el.children.length && !styled; k++) {
        if (el.children[k].getAttribute('style')) styled = true;
      }
      if (styled) { lines.push(el.outerHTML); continue; }
      if (tag === 'UL' && el.className.indexOf('todo') >= 0) {
        for (var j = 0; j < el.children.length; j++) {
          var li = el.children[j], box = li.querySelector('input');
          lines.push((box && box.checked ? '- [x] ' : '- [ ] ') + clean(ser(li)));
        }
        continue;
      }
      lines = lines.concat(listMd(el, 0, tag === 'OL'));
      continue;
    }
    if (tag === 'TABLE') { lines.push(el.outerHTML); continue; }
    if (el.getAttribute('style')) { lines.push(el.outerHTML); continue; }
    var text = clean(ser(el));
    // 空引用存成「>」：存成空行的话读回来就变成普通段落了
    if (tag === 'BLOCKQUOTE' && text === '') { lines.push('>'); continue; }
    // 空段落要留成空行，不然回车敲出来的空行一存就没；结尾的空行不用留（作者看不见）
    if (text === '') { lines.push(''); continue; }
    if (tag === 'H1') lines.push('# ' + text);
    else if (tag === 'H2') lines.push('## ' + text);
    else if (tag === 'H3') lines.push('### ' + text);
    else if (tag === 'BLOCKQUOTE') lines.push('> ' + text);
    else lines.push(text);
  }
  while (lines.length && lines[lines.length - 1] === '') lines.pop();
  return lines.join('\n');
}

// 空笔记才给标题位 + 一行正文。只在打开笔记时补（setMd），
// 不然用户把标题位删掉、再退格把最后一行也删空，补位又会把标题塞回来
function seedTitle() {
  var h = document.createElement('h1');
  h.appendChild(document.createElement('br'));
  var p = document.createElement('p');
  p.appendChild(document.createElement('br'));
  document.body.appendChild(h);
  document.body.appendChild(p);
}

function setMd(md) {
  document.body.innerHTML = mdToHtml(md);
  syncTodos();
  var head = document.body.firstElementChild;
  // 第一行空着（或者整篇空）就是标题位：用「标题」格式顶着，空着才有灰提示
  if (!head) seedTitle();
  // 只把空段落当标题位：第一行要是空列表/空引用，那是内容，不能换成标题
  else if (/^(P|DIV|H1|H2|H3)$/.test(head.nodeName) && !head.textContent.trim() &&
    !head.querySelector('img,hr,table,input,.player')) {
    var h = document.createElement('h1');
    h.appendChild(document.createElement('br'));
    document.body.replaceChild(h, head);
  }
  keepEmpty();
  hist = [];
  at = -1;
  snap();
}

function getMd() { return htmlToMd(); }

// 撤销/重做：WebView 失焦后 execCommand('undo') 不管用，自己留快照
var hist = [], at = -1, pending = 0;

function snap() {
  syncBoxes();
  var html = document.body.innerHTML;
  if (at >= 0 && hist[at] === html) return;
  hist = hist.slice(0, at + 1);
  hist.push(html);
  if (hist.length > 50) hist.shift();
  at = hist.length - 1;
}

function applySnap(html) {
  document.body.innerHTML = html;
  syncTodos();
  keepEmpty();
}

function undo() {
  if (at > 0) applySnap(hist[--at]);
}

function redo() {
  if (at < hist.length - 1) applySnap(hist[++at]);
}

// 顶栏的撤销/重做没有可走的历史时得灰掉
function canUndo() { return at > 0 ? 1 : 0; }

function canRedo() { return at < hist.length - 1 ? 1 : 0; }

// 点工具栏时 WebView 已经失焦，选区得自己记着；失焦后选区会塌到 body，那种不算数
var saved = null, lastBlk = null;

// 打开格式面板时 WebView 还拿着焦点，这一下先把选区抓下来；事件偶尔不来，就靠这里补
function syncSel() {
  var s = window.getSelection();
  if (!s || !s.rangeCount || !s.anchorNode || !document.body.contains(s.anchorNode)) return 0;
  var b = blockOf(s.anchorNode);
  if (!b) return 0;
  lastBlk = b;
  var r = s.getRangeAt(0);
  // 点面板会让选区塌掉；光标还落在刚才那几块里，就留着那次多选，
  // 不然再点一次同一个格式按钮就变成给第一块套第二层，取消不掉
  if (r.collapsed && saved && !saved.collapsed && document.body.contains(saved.startContainer)
    && saved.intersectsNode(b)) return 1;
  saved = r.cloneRange();
  return 1;
}

document.addEventListener('selectionchange', syncSel);

// 面板一开正文只剩一小条，改完那一行要自己滚进来，不然看着像没改
function see(el) {
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
}

function caretAt(el, atStart) {
  // 行里只有 <br> 时，光标放它后面就没有行盒了，会画到下一行去；放前面
  var n = el.childNodes.length;
  var off = atStart ? 0 : (n && el.lastChild.nodeName === 'BR' ? n - 1 : n);
  var r = document.createRange();
  r.setStart(el, off);
  r.collapse(true);
  var s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
  saved = r.cloneRange();
  see(el);
}

// 列表项的末尾在 .t 外面，光标落在 li 上打字就成了 li 里的裸文本，存盘时被丢掉
function caretIn(el) {
  var t = el.nodeName === 'LI' && el.querySelector('.t');
  caretAt(t || el, false);
}

function startOf(el, r) {
  var pre = document.createRange();
  pre.selectNodeContents(el);
  pre.setEnd(r.startContainer, r.startOffset);
  return pre.toString() === ''; // 复选框没有文字，算在行首里
}

// 列表的「•」「1.」是 CSS 画的、待办的框是 input，退格都删不掉；
// 在行首按退格就把这一项拆回正文段落（标记和框一起消失）
function lift(li) {
  var p = document.createElement('p'), span = li.querySelector('span.t');
  // 缩进/对齐/字号是行内样式，搬到新段落里，否则取消勾选框时这行会跳位
  var keep = ['marginLeft', 'textAlign', 'fontSize'];
  for (var q = 0; q < keep.length; q++) {
    if (li.style[keep[q]]) p.style[keep[q]] = li.style[keep[q]];
  }
  var kids = [].slice.call(span ? span.childNodes : li.childNodes);
  for (var i = 0; i < kids.length; i++) {
    var k = kids[i];
    if (k.nodeType === 1 && /^(INPUT|UL|OL)$/.test(k.nodeName)) continue;
    p.appendChild(k);
  }
  var list = li.parentNode, after = [], n;
  for (n = li.nextSibling; n; n = n.nextSibling) after.push(n);
  var tail = null;
  if (after.length) {
    // 后面的项另起一个同样的列表，插在段落后面，顺序不变
    tail = document.createElement(list.nodeName.toLowerCase());
    if (list.className) tail.className = list.className;
    for (var j = 0; j < after.length; j++) tail.appendChild(after[j]);
  }
  var ref = list.nextSibling;
  list.removeChild(li);
  list.parentNode.insertBefore(p, ref);
  if (tail) list.parentNode.insertBefore(tail, p.nextSibling);
  if (!list.children.length) list.parentNode.removeChild(list);
  if (!p.firstChild) p.appendChild(document.createElement('br'));
  caretAt(p, true);
  return p;
}

document.body.addEventListener('keydown', function (e) {
  if (e.key !== 'Backspace') return;
  var s = window.getSelection();
  if (!s.rangeCount || !s.isCollapsed) return;
  var r = s.getRangeAt(0), n = r.startContainer;
  var host = n.nodeType === 1 ? n : n.parentNode;
  var li = host && host.closest ? host.closest('li') : null;
  if (li && document.body.contains(li) && startOf(li, r)) {
    e.preventDefault();
    lift(li);
    snap();
    return;
  }
  // 第一行空着的标题位：在下一行行首退格就把它删掉，整篇变成普通正文
  var blk = blockOf(host);
  if (!blk || !startOf(blk, r)) return;
  var prev = blk.previousElementSibling;
  if (!prev) {
    // 已经是第一行行首、前面没东西可删：别交给浏览器，它会自己把行拆掉再补回来，光标就弹一下
    e.preventDefault();
    return;
  }
  if (prev.nodeName !== 'H1' || prev.textContent.trim()) return;
  e.preventDefault();
  document.body.removeChild(prev);
  keepEmpty();
  snap();
});

// 空着的一行列表/待办再回车：这一项退出列表回正文。
// 交给浏览器就只会一直加空项，列表永远出不来
document.body.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || e.shiftKey) return;
  var s = window.getSelection();
  if (!s.rangeCount) return;
  var r = s.getRangeAt(0);
  if (!r.collapsed) return;
  var host = r.startContainer.nodeType === 3 ? r.startContainer.parentNode : r.startContainer;
  var li = host.closest ? host.closest('li') : null;
  if (!li || !document.body.contains(li)) return;
  if (li.textContent.trim() || li.querySelector('img,hr,table,.player')) return;
  e.preventDefault();
  lift(li);
  keepEmpty();
  snap();
});

// 待办里回车：拆下一项这件事交给浏览器（自己动手输入法会把字插到列表外面去），
// 拆完光标落在复选框前面，打出来的字画在框上、勾选和删除线全对不上——挪进 .t。
// 必须等这一帧过完：要在浏览器自己插入完之后再摆光标，输入法才认
document.body.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || e.shiftKey) return;
  var s = window.getSelection();
  if (!s || !s.rangeCount) return;
  var r = s.getRangeAt(0);
  if (!r.collapsed) return;
  var host = r.startContainer.nodeType === 3 ? r.startContainer.parentNode : r.startContainer;
  var ul = host.closest ? host.closest('ul.todo') : null;
  if (!ul) return;
  setTimeout(function () { fixTodoCaret(ul); }, 0);
});

// 拆出来的待办项光标落在复选框前面（结构上就是 li 的开头），字会画到框上。
// 挪进 .t；顺便把散在 li 里的裸文本收进去
function fixTodoCaret(ul) {
  if (!document.body.contains(ul)) return;
  syncTodos();
  var sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  var n = sel.anchorNode, at = n && n.nodeType === 3 ? n.parentNode : n;
  if (!at || !at.closest || at.closest('span.t')) return; // 已经在 .t 里
  var li = at.closest('li');
  if (!li || li.parentNode !== ul) return;
  var t = li.querySelector('span.t');
  if (t) caretAt(t, true);
}

// 标题行末尾回车 → 下一行按正文来，不然一路都是大字（标题只是个块格式，这里只按标签判断）
document.body.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || e.shiftKey) return;
  var s = window.getSelection();
  if (!s.rangeCount) return;
  var r = s.getRangeAt(0);
  var host = r.startContainer.nodeType === 3 ? r.startContainer.parentNode : r.startContainer;
  var blk = blockOf(host);
  if (!blk || !/^H[123]$/.test(blk.nodeName)) return;
  var rest = document.createRange();
  rest.selectNodeContents(blk);
  rest.setStart(r.endContainer, r.endOffset);
  if (rest.toString().trim() !== '') return; // 光标在行中间就交给浏览器去拆行
  e.preventDefault();
  var p = document.createElement('p');
  p.appendChild(document.createElement('br'));
  blk.parentNode.insertBefore(p, blk.nextSibling);
  caretAt(p, true);
  snap();
});

// 标题是正文第一行，但按回车得进正文，不然再多出几行大字
// WebView 失焦后 execCommand 一律失效，所以格式全走 DOM，不再指望浏览器
function selBlock() {
  var blk = blockOf(saved ? saved.startContainer : null);
  if (blk) return blk;
  if (lastBlk && document.body.contains(lastBlk)) return lastBlk;
  return null;
}

// 新笔记里第一行是裸文本（<body> 下直接一个文本节点，没有段落包着）：
// 格式找不到块就另起空段落，看着像"点了没反应"；存盘也会把这行漏掉。先收成 <p>。
// 搬节点会把选区弄塌（选中两个字变成整行），搬完按原来的字位置放回去
function wrapBare() {
  var run = null, n = 0, kids = [].slice.call(document.body.childNodes);
  var a = saved && !saved.collapsed ? saved.startContainer : null;
  var ao = saved ? saved.startOffset : 0;
  var b = saved && !saved.collapsed ? saved.endContainer : null;
  var bo = saved ? saved.endOffset : 0;
  for (var i = 0; i < kids.length; i++) {
    var k = kids[i];
    if (k.nodeType === 3) {
      if (!k.nodeValue.trim()) continue;
      if (!run) {
        run = document.createElement('p');
        document.body.insertBefore(run, k);
      }
      run.appendChild(k);
      n++;
      continue;
    }
    run = null;
  }
  if (n && a && b && document.body.contains(a) && document.body.contains(b)) {
    var r = document.createRange();
    r.setStart(a, Math.min(ao, (a.nodeValue || '').length));
    r.setEnd(b, Math.min(bo, (b.nodeValue || '').length));
    saved = r.cloneRange();
    var s = window.getSelection();
    if (s) { s.removeAllRanges(); s.addRange(r); }
  }
  return n;
}

// 空笔记里点「标题」也得有东西可改；已经有内容就落到最后一行，不另起一个空段落。
// 手里有选区时不许动光标，否则「选中几个字」会变成「整行」
function ensureBlock() {
  var blk = selBlock();
  if (blk) return blk;
  var live = saved && !saved.collapsed ? saved : null;
  wrapBare();
  var kids = document.body.children, last = null;
  for (var i = kids.length - 1; i >= 0; i--) {
    if (!kids[i].textContent.trim()) continue; // 只有图片/分割线的段落不算可改的行
    if (/^(P|DIV|H1|H2|H3|BLOCKQUOTE|UL|OL)$/.test(kids[i].nodeName)) { last = kids[i]; break; }
  }
  var target = last && /^(UL|OL)$/.test(last.nodeName) ? last.lastElementChild : last;
  if (target) {
    if (!live) caretIn(target);
    return target;
  }
  var p = document.createElement('p');
  document.body.appendChild(p);
  if (!live) caretIn(p);
  return p;
}

// 空行得有一个 <br> 撑着，不然光标没有行盒，删完字就和文字错位
function keepEmpty() {
  var els = document.body.querySelectorAll('p,h1,h2,h3,blockquote,li,div');
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    if (el.querySelector('img,hr,table,input,.player')) continue;
    if (el.textContent.trim()) continue;
    var host = el.nodeName === 'LI' && el.querySelector('.t') ? el.querySelector('.t') : el;
    if (!host.firstChild) host.appendChild(document.createElement('br'));
  }
  // 分割线/表格在最后一行时，后面得有一行落光标，不然它删不掉
  var last = document.body.lastElementChild;
  if (last && /^(HR|TABLE)$/.test(last.nodeName)) {
    var tail = document.createElement('p');
    tail.appendChild(document.createElement('br'));
    document.body.appendChild(tail);
  }
  // 第一行就是标题位：只要它空着就留着灰提示，正文有字也一样
  var ph = document.querySelector('.ph');
  if (ph) ph.classList.remove('ph');
  var head = document.body.firstElementChild;
  if (!head || head.nodeName !== 'H1' || head.textContent.trim()) return;
  if (head.querySelector('img,hr,table,input,.player')) return;
  head.classList.add('ph');
}

// 选中的范围跨了几个块，就返回这几个块（列表取到 li，跳过列表本身）
function blocksOfRange(range) {
  var out = [], els = document.body.querySelectorAll('p,h1,h2,h3,blockquote,li');
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    if (el.querySelector('li')) continue;
    if (range.intersectsNode(el)) out.push(el);
  }
  return out;
}

// 改完格式，选区自己就塌了；再点一次同一个按钮会变成"套第二层"而不是取消。
// 改完把选区重新罩住这几块
function reselect(list) {
  if (!list.length) return;
  var last = list[list.length - 1], r = document.createRange();
  r.setStart(list[0], 0);
  r.setEnd(last, last.childNodes.length);
  var s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
  saved = r.cloneRange();
}

// 把整块内容套进 tag（列表项保留复选框，嵌套列表不动）
function wrapWhole(blk, tag) {
  var el = document.createElement(tag);
  var kids = [].slice.call(blk.childNodes);
  for (var i = 0; i < kids.length; i++) {
    if (/^(UL|OL|LI|INPUT)$/.test(kids[i].nodeName)) continue;
    el.appendChild(kids[i]);
  }
  if (!el.firstChild) return null;
  blk.appendChild(el);
  return el;
}

function unwrapAll(blk, tag) {
  var h;
  while ((h = blk.querySelector(tag))) unwrap(h);
}

function setTag(blk, tag) {
  var want = tag === 'blockquote' ? 'BLOCKQUOTE' : tag.toUpperCase();
  if (blk.nodeName === want) return blk;
  if (blk.nodeName === 'LI') { // 列表项先拆成段落，再换标签，位置才不会跑到整张列表后面
    return setTag(lift(blk), tag);
  }
  var el = document.createElement(tag);
  while (blk.firstChild) el.appendChild(blk.firstChild);
  blk.parentNode.replaceChild(el, blk);
  return el;
}

// 标签自己就带字号；行内字号是留着表示「列表项还是大字」的，一改块格式就该让位
function plain(el) {
  el.style.fontSize = '';
  el.style.fontWeight = '';
  return el;
}

var BIG = { H1: '24px', H2: '20px', H3: '16px' };

// 分条、待办勾选框和标题字号是两回事（参考里能同时有），可是 markdown 一行只能有一个标记，
// 所以列表项不改标签：标题字号写成行内样式，分条和框都留着（带样式的列表本来整段按 HTML 存）
function styleTag(blk, tag) {
  if (blk.nodeName === 'LI' && tag !== 'blockquote') {
    var size = BIG[tag.toUpperCase()];
    blk.style.fontSize = size || '';
    blk.style.fontWeight = size ? '600' : '';
    return tidy(blk);
  }
  return plain(setTag(blk, tag));
}

function block(tag) {
  syncSel();
  wrapBare();
  var picked = saved && !saved.collapsed ? blocksOfRange(saved) : [];
  if (picked.length > 1) {
    for (var i = 0; i < picked.length; i++) picked[i] = styleTag(picked[i], tag);
    syncTodos();
    reselect(picked);
    see(picked[0]);
    return 1;
  }
  var blk = ensureBlock();
  if (!blk) return 0;
  var want = tag === 'blockquote' ? 'BLOCKQUOTE' : tag.toUpperCase();
  if (blk.nodeName !== want) caretIn(styleTag(blk, tag));
  else plain(blk);
  syncTodos();
  return 1;
}

// 再点一次同样的样式就拆掉
function unwrap(el) {
  var parent = el.parentNode;
  while (el.firstChild) parent.insertBefore(el.firstChild, el);
  parent.removeChild(el);
}

// 行内样式和浏览器打字是同一种东西：有选区就交给浏览器自己做（选几个字就只改几个字、
// 取消、粗体里套斜体、跨段落都归它管）；只有光标时按整行切换
var CMD = { b: 'bold', i: 'italic', s: 'strikeThrough', u: 'underline' };

function keepSel() {
  var s = window.getSelection();
  if (!s || !s.rangeCount) return;
  var b = blockOf(s.anchorNode);
  if (b) lastBlk = b;
  saved = s.getRangeAt(0).cloneRange();
}

function wrapTag(tag) {
  syncSel();
  wrapBare();
  var picked = saved && !saved.collapsed ? blocksOfRange(saved) : [];

  // 跨多行：逐块整行处理
  if (picked.length > 1) {
    var on = true;
    for (var i = 0; i < picked.length; i++) {
      if (!picked[i].querySelector(tag)) { on = false; break; }
    }
    for (var j = 0; j < picked.length; j++) {
      if (on) unwrapAll(picked[j], tag);
      else if (!picked[j].querySelector(tag)) wrapWhole(picked[j], tag);
    }
    reselect(picked);
    see(picked[0]);
    return 1;
  }

  // 选中了几个字：只改这几个字
  if (picked.length === 1 && saved.toString() !== '') {
    var s = window.getSelection();
    s.removeAllRanges();
    s.addRange(saved);
    document.execCommand('styleWithCSS', false, false);
    var ok = document.execCommand(CMD[tag], false, null);
    keepSel();
    see(picked[0]);
    return ok ? 1 : 0;
  }

  // 只有光标：整行切换，再点一次能取消
  var blk = ensureBlock();
  if (!blk) return 0;
  if (blk.querySelector(tag)) {
    unwrapAll(blk, tag);
    return 1;
  }
  var whole = wrapWhole(blk, tag);
  if (whole) caretIn(whole);
  return 1;
}

// 样式全清掉了就把空的 style="" 去掉，否则存盘会变成一堆没用的内嵌 HTML
function tidy(el) {
  if (el.getAttribute('style') !== null && !el.style.length) el.removeAttribute('style');
  return el;
}

function list(ordered) {
  syncSel();
  wrapBare();
  var picked = saved && !saved.collapsed ? blocksOfRange(saved) : [];
  if (picked.length > 1) {
    for (var i = 0; i < picked.length; i++) toList(picked[i], ordered);
    syncTodos();
    see(picked[0]);
    return 1;
  }
  var blk = ensureBlock();
  if (!blk) return 0;
  caretIn(toList(blk, ordered));
  return 1;
}

// 把一块变成列表项；已经是这种列表就拆回段落。返回该落在光标上的元素
// 标题和编号在参考里是两回事、能同时有；markdown 没这种写法，就把字号写成行内样式，
// 带样式的列表 htmlToMd 本来就整段按 HTML 存
function sizeInto(el, from) {
  if (!BIG[from.nodeName]) return;
  el.style.fontSize = BIG[from.nodeName];
  el.style.fontWeight = '600';
}

function toList(blk, ordered) {
  var want = ordered ? 'OL' : 'UL';
  if (blk.nodeName === 'LI') {
    var host = blk.parentNode;
    if (host.nodeName === want) return lift(blk); // 再点一次取消，只动这一行
    var neo = document.createElement(want.toLowerCase());
    while (host.firstChild) neo.appendChild(host.firstChild);
    host.parentNode.replaceChild(neo, host);
    return blk;
  }
  var wrap = document.createElement(want.toLowerCase()), item = document.createElement('li');
  while (blk.firstChild) item.appendChild(blk.firstChild);
  sizeInto(item, blk);
  wrap.appendChild(item);
  blk.parentNode.replaceChild(wrap, blk);
  return item;
}

function currentLi() {
  var node = saved ? saved.startContainer : null;
  while (node && node !== document.body && node.nodeName !== 'LI') node = node.parentNode;
  return node && node.nodeName === 'LI' ? node : null;
}

function wrapTodo(li) {
  var box = document.createElement('input');
  box.type = 'checkbox';
  box.setAttribute('contenteditable', 'false');
  var span = document.createElement('span');
  span.className = 't';
  while (li.firstChild) span.appendChild(li.firstChild);
  // 空的勾选框也得有行盒，否则光标画到框前面去，打出来的字还落在 .t 外面
  if (!span.firstChild) span.appendChild(document.createElement('br'));
  li.setAttribute('data-done', '0');
  li.appendChild(box);
  li.appendChild(span);
}

// 待办项里只该有「复选框 + .t」。浏览器拆行、输入法自己插字的时候，散在 li 里的裸文本
// 会画到复选框上（勾选和删除线也对不上）。挪节点不碰选区，光标跟着文本节点一起走
function syncTodos() {
  var lis = document.querySelectorAll('ul.todo > li');
  for (var i = 0; i < lis.length; i++) {
    var li = lis[i], box = li.querySelector('input'), t = li.querySelector('span.t');
    if (!box) {
      // 浏览器拆列表项时框不会跟着复制过来：补一个，别把已有的 .t 再套一层
      box = document.createElement('input');
      box.type = 'checkbox';
      box.setAttribute('contenteditable', 'false');
      li.insertBefore(box, li.firstChild);
      li.setAttribute('data-done', '0');
    }
    if (!t) { t = document.createElement('span'); t.className = 't'; li.appendChild(t); }
    if (li.firstChild !== box) li.insertBefore(box, li.firstChild);
    var head = [], tail = [], seen = false, n = li.childNodes;
    for (var k = 0; k < n.length; k++) {
      var c = n[k];
      if (c === t) { seen = true; continue; }
      if (c === box || /^(UL|OL)$/.test(c.nodeName)) continue;
      (seen ? tail : head).push(c);
    }
    for (var h = head.length - 1; h >= 0; h--) t.insertBefore(head[h], t.firstChild);
    for (var q = 0; q < tail.length; q++) t.appendChild(tail[q]);
  }
}

function toTodo(blk) {
  if (blk.nodeName === 'LI') {
    var ul = blk.parentNode;
    if (ul.classList.contains('todo')) return lift(blk); // 再点一次取消，这一行的缩进/对齐跟着走
    if (ul.nodeName === 'OL') {
      // markdown 只有 - [ ] 这一种待办写法，编号待办存不下；统一落成无序待办，别一存就把框丢了
      var neo = document.createElement('ul');
      while (ul.firstChild) neo.appendChild(ul.firstChild);
      ul.parentNode.replaceChild(neo, ul);
      ul = neo;
    }
    ul.classList.add('todo');
    for (var i = 0; i < ul.children.length; i++) {
      if (!ul.children[i].querySelector('input')) wrapTodo(ul.children[i]);
    }
    return blk;
  }
  var list = document.createElement('ul'), item = document.createElement('li');
  list.className = 'todo';
  while (blk.firstChild) item.appendChild(blk.firstChild);
  sizeInto(item, blk);
  wrapTodo(item);
  list.appendChild(item);
  blk.parentNode.replaceChild(list, blk);
  return item.lastChild;
}

function todo() {
  syncSel();
  wrapBare();
  var picked = saved && !saved.collapsed ? blocksOfRange(saved) : [];
  if (picked.length > 1) {
    for (var i = 0; i < picked.length; i++) toTodo(picked[i]);
    syncTodos();
    see(picked[0]);
    return 1;
  }
  if (currentLi()) { toTodo(currentLi()); return 1; }
  var blk = ensureBlock();
  if (!blk) return 0;
  caretIn(toTodo(blk));
  return 1;
}

// 插入的东西跟在当前段落后面，落成单独一段
// 但表格/分割线/图片不能塞进 <ul> 里：会把列表行挤乱，存盘还会被当成列表项
function afterBlk(blk) {
  while (/^(LI|UL|OL)$/.test(blk.nodeName) && blk.parentNode && blk.parentNode !== document.body) blk = blk.parentNode;
  return blk;
}

function insertAfter(node) {
  var blk = afterBlk(ensureBlock()), p = document.createElement('p');
  p.appendChild(node);
  blk.parentNode.insertBefore(p, blk.nextSibling);
}

function insertImage(path) {
  var img = document.createElement('img');
  img.src = path;
  insertAfter(img);
}

function insertLink(path, label) {
  if (/\.(m4a|mp3|aac|wav|ogg)$/i.test(path)) {
    var box = document.createElement('div');
    box.innerHTML = playerHtml(path, label);
    insertAfter(box.firstChild);
    return;
  }
  var a = document.createElement('a');
  a.href = path;
  a.textContent = label;
  insertAfter(a);
}

function insertText(text) {
  var blk = selBlock();
  if (!blk) {
    blk = document.createElement('p');
    document.body.appendChild(blk);
  }
  if (saved && blk.contains(saved.startContainer)) {
    saved.deleteContents();
    saved.insertNode(document.createTextNode(text));
  } else {
    blk.appendChild(document.createTextNode(text));
  }
}

function insertHr() {
  var blk = afterBlk(ensureBlock()), hr = document.createElement('hr');
  blk.parentNode.insertBefore(hr, blk.nextSibling);
  // 分割线是空元素，光标进不去；后面没有行它就永远删不掉，得补一行
  if (!hr.nextElementSibling) {
    var p = document.createElement('p');
    p.appendChild(document.createElement('br'));
    hr.parentNode.appendChild(p);
    caretAt(p, true);
  }
}

function insertTable() {
  var cell = '<td><br></td><td><br></td>';
  // 表格直接插在段落后面，不套 <p>（套了浏览器会把 <p> 拆开，存盘也会丢）
  var blk = afterBlk(ensureBlock());
  var frag = document.createRange().createContextualFragment(
    '<table><tbody><tr>' + cell + '</tr><tr>' + cell + '</tr></tbody></table>');
  blk.parentNode.insertBefore(frag, blk.nextSibling);
}

function blockOf(node) {
  while (node && node !== document.body && !/^(P|DIV|H1|H2|H3|BLOCKQUOTE|LI)$/.test(node.nodeName)) node = node.parentNode;
  return node && node !== document.body ? node : null;
}

snap();
document.body.addEventListener('input', function () {
  syncTodos();
  keepEmpty();
  clearTimeout(pending);
  pending = setTimeout(snap, 400);
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t && t.type === 'checkbox' && t.parentNode && t.parentNode.nodeName === 'LI') {
    t.parentNode.setAttribute('data-done', t.checked ? '1' : '0');
  }
});
</script>
</html>
