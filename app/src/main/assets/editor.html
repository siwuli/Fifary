<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    padding: 4px 20px 120px 20px;
    font: 16px/1.65 -apple-system, "sans-serif";
    color: #1b1b1f;
    -webkit-user-select: text;
    outline: none;
    word-break: break-word;
  }
  body:empty::before { content: "输入文本"; color: #b8b8bc; }
  h1 { font-size: 24px; font-weight: 600; margin: 14px 0 6px; }
  h2 { font-size: 20px; font-weight: 600; margin: 13px 0 6px; }
  h3 { font-size: 16px; font-weight: 600; margin: 12px 0 6px; }
  p { margin: 6px 0; min-height: 1.65em; }
  blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid #d9c07a; color: #666; font-size: 14px; }
  code { font-family: monospace; background: #f2f2f4; padding: 1px 4px; border-radius: 4px; }
  img { max-width: 100%; border-radius: 12px; margin: 8px 0; }
  hr { border: none; border-top: 1px solid #e2e2e6; margin: 14px 0; }
  ul, ol { margin: 6px 0; padding-left: 24px; }
  li { margin: 2px 0; }
  a { color: #2f6bff; }
  .player { display: inline-flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; margin: 6px 0; padding: 8px 12px; background: #f4f4f6; border-radius: 14px; vertical-align: middle; -webkit-user-select: none; user-select: none; }
  .player .pp { flex: none; width: 32px; height: 32px; line-height: 32px; text-align: center; border-radius: 50%; background: #2f6bff; color: #fff; font-size: 13px; }
  .player .bar { flex: 1; height: 4px; border-radius: 2px; background: #dcdce2; overflow: hidden; }
  .player .fill { display: block; height: 100%; width: 0; background: #2f6bff; }
  .player .t { flex: none; font-size: 12px; color: #666; font-variant-numeric: tabular-nums; }
  mark { background: #ffe9a8; }
  ul.todo { list-style: none; padding-left: 0; }
  ul.todo > li { display: flex; gap: 8px; align-items: flex-start; }
  ul.todo > li > input { font-size: inherit; width: 1em; height: 1em; margin: 0.32em 0 0 0; flex: none; accent-color: #2f6bff; }
  ul.todo > li[data-done="1"] > .t { color: #9a9a9e; text-decoration: line-through; }
</style>
</head>
<body contenteditable="true" spellcheck="false"></body>
<script>
function inline(s) {
  var keep = [];
  s = s.replace(/<(\/?)(u|mark|sub|sup|span)(\s[^>]*)?>/gi, function (m) {
    keep.push(m);
    return '\u0001' + (keep.length - 1) + '\u0001';
  });
  s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  s = s
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, src) { return '<img src="' + src + '" alt="' + alt + '">'; })
    .replace(/\[([^\]]+)\]\(([^)\s]+\.(?:m4a|mp3|aac|wav|ogg))\)/gi, function (m, t, src) { return playerHtml(src, t); })
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, href) { return '<a href="' + href + '">' + t + '</a>'; })
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  return s.replace(/\u0001(\d+)\u0001/g, function (m, i) { return keep[+i]; });
}

function todoRun(L, cur) {
  var out = '<ul class="todo">';
  while (cur.i < L.length) {
    var m = L[cur.i].trim().match(/^[-*]\s+\[([ xX])\]\s*(.*)$/);
    if (!m) break;
    var done = /x/i.test(m[1]);
    out += '<li data-done="' + (done ? 1 : 0) + '"><input type="checkbox" contenteditable="false"' +
      (done ? ' checked' : '') + '><span class="t">' + inline(m[2]) + '</span></li>';
    cur.i++;
  }
  return out + '</ul>';
}

function listRun(L, cur) {
  var out = '', stack = [];
  function closeOne() { var e = stack.pop(); out += '</li></' + e.tag + '>'; }
  while (cur.i < L.length) {
    var raw = L[cur.i], t = raw.trim();
    if (t === '') { cur.i++; continue; }
    var m = t.match(/^([-*+]|\d+\.)\s+(.*)$/);
    if (!m) break;
    var ind = raw.length - raw.replace(/^[ \t]+/, '').length;
    var tag = /^\d+\.$/.test(m[1]) ? 'ol' : 'ul';
    if (!stack.length) {
      stack.push({ tag: tag, ind: ind });
      out += '<' + tag + '>';
    } else {
      var top = stack[stack.length - 1];
      if (ind > top.ind) {
        stack.push({ tag: tag, ind: ind });
        out += '<' + tag + '>';
      } else if (ind < top.ind) {
        while (stack.length > 1 && ind < stack[stack.length - 1].ind) closeOne();
        out += '</li>';
      } else if (tag !== top.tag) {
        closeOne();
        stack.push({ tag: tag, ind: ind });
        out += '<' + tag + '>';
      } else {
        out += '</li>';
      }
    }
    out += '<li>' + inline(m[2]);
    cur.i++;
  }
  while (stack.length) closeOne();
  return out;
}

function mdToHtml(md) {
  var L = (md || '').replace(/\r/g, '').split('\n'), out = [], cur = { i: 0 };
  while (cur.i < L.length) {
    var t = L[cur.i].trim();
    if (t === '') { cur.i++; continue; }
    if (/^<(div|p|h1|h2|h3|ul|ol|blockquote|hr|img|table)\b/i.test(t)) { out.push(t); cur.i++; continue; }
    if (t === '---') { out.push('<hr>'); cur.i++; continue; }
    var h = t.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      var lv = h[1].length;
      out.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>');
      cur.i++;
      continue;
    }
    if (/^>\s?/.test(t)) { out.push('<blockquote>' + inline(t.replace(/^>\s?/, '')) + '</blockquote>'); cur.i++; continue; }
    if (/^[-*]\s+\[[ xX]\]\s*/.test(t)) { out.push(todoRun(L, cur)); continue; }
    if (/^([-*+]|\d+\.)\s+/.test(t)) { out.push(listRun(L, cur)); continue; }
    out.push('<p>' + inline(t) + '</p>');
    cur.i++;
  }
  return out.join('');
}

function fmt(open, close, n) {
  var inner = ser(n);
  return inner ? open + inner + close : '';
}

function ser(node) {
  var s = '';
  for (var i = 0; i < node.childNodes.length; i++) {
    var n = node.childNodes[i];
    if (n.nodeType === 3) { s += n.nodeValue; continue; }
    if (n.nodeType !== 1) continue;
    var tag = n.nodeName;
    if (tag === 'INPUT') continue;
    if (tag === 'B' || tag === 'STRONG') s += fmt('**', '**', n);
    else if (tag === 'I' || tag === 'EM') s += fmt('*', '*', n);
    else if (tag === 'S' || tag === 'STRIKE' || tag === 'DEL') s += fmt('~~', '~~', n);
    else if (tag === 'CODE') s += fmt('`', '`', n);
    else if (tag === 'U') s += fmt('<u>', '</u>', n);
    else if (tag === 'MARK') s += fmt('<mark>', '</mark>', n);
    else if (tag === 'A') s += '[' + ser(n) + '](' + n.getAttribute('href') + ')';
    else if (tag === 'IMG') s += '![](' + n.getAttribute('src') + ')';
    else if (tag === 'BR') s += '\n';
    else if (tag === 'SPAN' && n.className.indexOf('player') >= 0) {
      s += '[' + n.getAttribute('data-label') + '](' + n.getAttribute('data-src') + ')';
    } else if (tag === 'SPAN' && n.getAttribute('style')) {
      s += '<span style="' + n.getAttribute('style') + '">' + ser(n) + '</span>';
    } else s += ser(n);
  }
  return s;
}

function clean(x) { return x.replace(/\u00a0/g, ' ').trim(); }

function clock(s) {
  if (!isFinite(s)) s = 0;
  var m = Math.floor(s / 60), r = Math.floor(s % 60);
  return m + ':' + (r < 10 ? '0' : '') + r;
}

// 录音在正文里就是播放器：播放/暂停 + 进度条 + 时长，点进度条能拖
function playerHtml(src, label) {
  return '<span class="player" contenteditable="false" data-src="' + src + '" data-label="' + label + '">' +
    '<span class="pp">▶</span><span class="bar"><span class="fill"></span></span>' +
    '<span class="t">' + label + '</span></span>';
}

document.addEventListener('click', function (e) {
  var d = e.target.closest ? e.target.closest('.player') : null;
  if (!d) return;
  e.preventDefault();
  if (!d.audio) {
    var a = new Audio(d.getAttribute('data-src'));
    d.audio = a;
    var fill = d.querySelector('.fill'), t = d.querySelector('.t');
    a.addEventListener('loadedmetadata', function () { t.textContent = '0:00 / ' + clock(a.duration); });
    a.addEventListener('timeupdate', function () {
      fill.style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + '%';
      t.textContent = clock(a.currentTime) + ' / ' + clock(a.duration);
    });
    a.addEventListener('ended', function () {
      d.querySelector('.pp').textContent = '▶';
      fill.style.width = '0%';
      t.textContent = d.getAttribute('data-label');
    });
  }
  var au = d.audio;
  if (e.target.closest('.bar')) {
    var r = d.querySelector('.bar').getBoundingClientRect();
    if (au.duration) au.currentTime = au.duration * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    return;
  }
  if (au.paused) { au.play(); d.querySelector('.pp').textContent = '⏸'; }
  else { au.pause(); d.querySelector('.pp').textContent = '▶'; }
});

function listMd(el, depth, ordered) {
  var pad = '', lines = [];
  for (var d = 0; d < depth; d++) pad += '  ';
  for (var i = 0; i < el.children.length; i++) {
    var li = el.children[i], sub = null, buf = '';
    for (var j = 0; j < li.childNodes.length; j++) {
      var c = li.childNodes[j];
      if (c.nodeType === 1 && /^(UL|OL)$/.test(c.nodeName)) { sub = c; continue; }
      buf += ser({ childNodes: [c] });
    }
    lines.push(pad + (ordered ? (i + 1) + '. ' : '- ') + clean(buf));
    if (sub) lines = lines.concat(listMd(sub, depth + 1, sub.nodeName === 'OL'));
  }
  return lines;
}

function htmlToMd() {
  wrapBare();
  var lines = [], kids = document.body.children;
  for (var i = 0; i < kids.length; i++) {
    var el = kids[i];
    if (!el || el.nodeName === 'INPUT' || el.nodeName === 'BR') continue;
    var tag = el.nodeName;
    if (tag === 'HR') { lines.push('---'); continue; }
    if (tag === 'IMG') { lines.push('![](' + el.getAttribute('src') + ')'); continue; }
    if (tag === 'UL' && el.className.indexOf('todo') >= 0) {
      for (var j = 0; j < el.children.length; j++) {
        var li = el.children[j], box = li.querySelector('input');
        lines.push((box && box.checked ? '- [x] ' : '- [ ] ') + clean(ser(li)));
      }
      continue;
    }
    if (tag === 'UL' || tag === 'OL') { lines = lines.concat(listMd(el, 0, tag === 'OL')); continue; }
    if (tag === 'TABLE') { lines.push(el.outerHTML); continue; }
    if (el.getAttribute('style')) { lines.push(el.outerHTML); continue; }
    var text = clean(ser(el));
    if (text === '') continue;
    if (tag === 'H1') lines.push('# ' + text);
    else if (tag === 'H2') lines.push('## ' + text);
    else if (tag === 'H3') lines.push('### ' + text);
    else if (tag === 'BLOCKQUOTE') lines.push('> ' + text);
    else lines.push(text);
  }
  return lines.join('\n');
}

function setMd(md) {
  document.body.innerHTML = mdToHtml(md);
  syncTodos();
  hist = [];
  at = -1;
  snap();
}

function getMd() { return htmlToMd(); }

// 撤销/重做：WebView 失焦后 execCommand('undo') 不管用，自己留快照
var hist = [], at = -1, pending = 0;

function snap() {
  // 勾选状态是属性之外的，先写回属性，否则撤销一次就把勾抹了
  var boxes = document.querySelectorAll('ul.todo input[type=checkbox]');
  for (var b = 0; b < boxes.length; b++) {
    if (boxes[b].checked) boxes[b].setAttribute('checked', '');
    else boxes[b].removeAttribute('checked');
  }
  var html = document.body.innerHTML;
  if (at >= 0 && hist[at] === html) return;
  hist = hist.slice(0, at + 1);
  hist.push(html);
  if (hist.length > 50) hist.shift();
  at = hist.length - 1;
}

function applySnap(html) {
  document.body.innerHTML = html;
  syncTodos();
}

function undo() {
  if (at > 0) applySnap(hist[--at]);
}

function redo() {
  if (at < hist.length - 1) applySnap(hist[++at]);
}

// 顶栏的撤销/重做没有可走的历史时得灰掉
function canUndo() { return at > 0 ? 1 : 0; }

function canRedo() { return at < hist.length - 1 ? 1 : 0; }

// 点工具栏时 WebView 已经失焦，选区得自己记着；失焦后选区会塌到 body，那种不算数
var saved = null, lastBlk = null;

// 打开格式面板时 WebView 还拿着焦点，这一下先把选区抓下来；事件偶尔不来，就靠这里补
function syncSel() {
  var s = window.getSelection();
  if (!s || !s.rangeCount || !s.anchorNode || !document.body.contains(s.anchorNode)) return 0;
  var b = blockOf(s.anchorNode);
  if (!b) return 0;
  lastBlk = b;
  var r = s.getRangeAt(0);
  // 点面板会让选区塌掉；光标还落在刚才那几块里，就留着那次多选，
  // 不然再点一次同一个格式按钮就变成给第一块套第二层，取消不掉
  if (r.collapsed && saved && !saved.collapsed && document.body.contains(saved.startContainer)
    && saved.intersectsNode(b)) return 1;
  saved = r.cloneRange();
  return 1;
}

document.addEventListener('selectionchange', syncSel);

// 面板一开正文只剩一小条，改完那一行要自己滚进来，不然看着像没改
function see(el) {
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
}

function caretAt(el, atStart) {
  var r = document.createRange();
  r.selectNodeContents(el);
  r.collapse(!!atStart);
  var s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
  saved = r.cloneRange();
  see(el);
}

function caretIn(el) { caretAt(el, false); }

function startOf(el, r) {
  var pre = document.createRange();
  pre.selectNodeContents(el);
  pre.setEnd(r.startContainer, r.startOffset);
  return pre.toString() === ''; // 复选框没有文字，算在行首里
}

// 列表的「•」「1.」是 CSS 画的、待办的框是 input，退格都删不掉；
// 在行首按退格就把这一项拆回正文段落（标记和框一起消失）
function lift(li) {
  var p = document.createElement('p'), span = li.querySelector('span.t');
  // 缩进/对齐/字号是行内样式，搬到新段落里，否则取消勾选框时这行会跳位
  var keep = ['marginLeft', 'textAlign', 'fontSize'];
  for (var q = 0; q < keep.length; q++) {
    if (li.style[keep[q]]) p.style[keep[q]] = li.style[keep[q]];
  }
  var kids = [].slice.call(span ? span.childNodes : li.childNodes);
  for (var i = 0; i < kids.length; i++) {
    var k = kids[i];
    if (k.nodeType === 1 && /^(INPUT|UL|OL)$/.test(k.nodeName)) continue;
    p.appendChild(k);
  }
  var list = li.parentNode, after = [], n;
  for (n = li.nextSibling; n; n = n.nextSibling) after.push(n);
  var tail = null;
  if (after.length) {
    // 后面的项另起一个同样的列表，插在段落后面，顺序不变
    tail = document.createElement(list.nodeName.toLowerCase());
    if (list.className) tail.className = list.className;
    for (var j = 0; j < after.length; j++) tail.appendChild(after[j]);
  }
  var ref = list.nextSibling;
  list.removeChild(li);
  list.parentNode.insertBefore(p, ref);
  if (tail) list.parentNode.insertBefore(tail, p.nextSibling);
  if (!list.children.length) list.parentNode.removeChild(list);
  caretAt(p, true);
  return p;
}

document.body.addEventListener('keydown', function (e) {
  if (e.key !== 'Backspace') return;
  var s = window.getSelection();
  if (!s.rangeCount || !s.isCollapsed) return;
  var r = s.getRangeAt(0), n = r.startContainer;
  var host = n.nodeType === 1 ? n : n.parentNode;
  var li = host && host.closest ? host.closest('li') : null;
  if (!li || !document.body.contains(li) || !startOf(li, r)) return;
  e.preventDefault();
  lift(li);
  snap();
});

// WebView 失焦后 execCommand 一律失效，所以格式全走 DOM，不再指望浏览器
function selBlock() {
  var blk = blockOf(saved ? saved.startContainer : null);
  if (blk) return blk;
  if (lastBlk && document.body.contains(lastBlk)) return lastBlk;
  return null;
}

// 新笔记里第一行是裸文本（<body> 下直接一个文本节点，没有段落包着）：
// 格式找不到块就另起空段落，看着像"点了没反应"；存盘也会把这行漏掉。先收成 <p>
function wrapBare() {
  var run = null, n = 0, kids = [].slice.call(document.body.childNodes);
  for (var i = 0; i < kids.length; i++) {
    var k = kids[i];
    if (k.nodeType === 3) {
      if (!k.nodeValue.trim()) continue;
      if (!run) {
        run = document.createElement('p');
        document.body.insertBefore(run, k);
      }
      run.appendChild(k);
      n++;
      continue;
    }
    run = null;
  }
  return n;
}

// 空笔记里点「标题」「字号」也得有东西可改；已经有内容就落到最后一行，不另起一个空段落
function ensureBlock() {
  var blk = selBlock();
  if (blk) return blk;
  wrapBare();
  var kids = document.body.children, last = null;
  for (var i = kids.length - 1; i >= 0; i--) {
    if (!kids[i].textContent.trim()) continue; // 只有图片/分割线的段落不算可改的行
    if (/^(P|DIV|H1|H2|H3|BLOCKQUOTE|UL|OL)$/.test(kids[i].nodeName)) { last = kids[i]; break; }
  }
  var target = last && /^(UL|OL)$/.test(last.nodeName) ? last.lastElementChild : last;
  if (target) {
    caretIn(target);
    return target;
  }
  var p = document.createElement('p');
  document.body.appendChild(p);
  caretIn(p);
  return p;
}

// 选中的范围跨了几个块，就返回这几个块（列表取到 li，跳过列表本身）
function blocksOfRange(range) {
  var out = [], els = document.body.querySelectorAll('p,h1,h2,h3,blockquote,li');
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    if (el.querySelector('li')) continue;
    if (range.intersectsNode(el)) out.push(el);
  }
  return out;
}

// 改完格式，选区自己就塌了；再点一次同一个按钮会变成"套第二层"而不是取消。
// 改完把选区重新罩住这几块
function reselect(list) {
  if (!list.length) return;
  var last = list[list.length - 1], r = document.createRange();
  r.setStart(list[0], 0);
  r.setEnd(last, last.childNodes.length);
  var s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
  saved = r.cloneRange();
}

// 把整块内容套进 tag（列表项保留复选框，嵌套列表不动）
function wrapWhole(blk, tag) {
  var el = document.createElement(tag);
  var kids = [].slice.call(blk.childNodes);
  for (var i = 0; i < kids.length; i++) {
    if (/^(UL|OL|LI|INPUT)$/.test(kids[i].nodeName)) continue;
    el.appendChild(kids[i]);
  }
  if (!el.firstChild) return null;
  blk.appendChild(el);
  return el;
}

function unwrapAll(blk, tag) {
  var h;
  while ((h = blk.querySelector(tag))) unwrap(h);
}

function setTag(blk, tag) {
  var want = tag === 'blockquote' ? 'BLOCKQUOTE' : tag.toUpperCase();
  if (blk.nodeName === want) return blk;
  var el = document.createElement(tag);
  while (blk.firstChild) el.appendChild(blk.firstChild);
  if (blk.nodeName === 'LI') {
    // 列表项换成标题得先搬出列表，否则 <h1> 会留在 <ul> 里
    var list = blk.parentNode;
    list.parentNode.insertBefore(el, list.nextSibling);
    list.removeChild(blk);
    if (!list.children.length) list.parentNode.removeChild(list);
  } else {
    blk.parentNode.replaceChild(el, blk);
  }
  return el;
}

function block(tag) {
  syncSel();
  var picked = saved && !saved.collapsed ? blocksOfRange(saved) : [];
  if (picked.length > 1) {
    for (var i = 0; i < picked.length; i++) picked[i] = setTag(picked[i], tag);
    syncTodos();
    reselect(picked);
    see(picked[0]);
    return 1;
  }
  var blk = ensureBlock();
  if (!blk) return 0;
  var want = tag === 'blockquote' ? 'BLOCKQUOTE' : tag.toUpperCase();
  if (blk.nodeName !== want) caretIn(setTag(blk, tag));
  syncTodos();
  return 1;
}

// 再点一次同样的样式就拆掉
function unwrap(el) {
  var parent = el.parentNode;
  while (el.firstChild) parent.insertBefore(el.firstChild, el);
  parent.removeChild(el);
}

function wrapTag(tag) {
  syncSel();
  var picked = saved && !saved.collapsed ? blocksOfRange(saved) : [];
  // 跨行选中就整行逐块处理，等于批量调整
  if (picked.length > 1) {
    // 每一块都已经有了才当"取消"；只要有一块没有，这次是"加上"
    var on = true;
    for (var i = 0; i < picked.length; i++) {
      if (!picked[i].querySelector(tag)) { on = false; break; }
    }
    for (var i = 0; i < picked.length; i++) {
      if (on) unwrapAll(picked[i], tag); else wrapWhole(picked[i], tag);
    }
    reselect(picked);
    see(picked[0]);
    return 1;
  }
  var blk = ensureBlock();
  if (!blk) return 0;
  var node = saved ? saved.startContainer : null;
  var up = node && node.nodeType === 1 ? node : node && node.parentNode;
  var host = up && up.closest ? up.closest(tag) : null;
  if (host && blk.contains(host)) { unwrap(host); return 1; }
  var range = saved && !saved.collapsed && blk.contains(saved.startContainer) ? saved : null;
  if (range) {
    var el = document.createElement(tag);
    el.appendChild(range.extractContents());
    if (!el.firstChild) return 0;
    range.insertNode(el);
    caretIn(el);
  } else {
    // shortcut: 没有选区（只有光标）时整行生效，等 WebView 能保住输入焦点再做"从下一个字起生效"
    var whole = wrapWhole(blk, tag);
    if (whole) caretIn(whole);
  }
  return 1;
}

function styleBlock(prop, value) {
  var blk = ensureBlock();
  if (!blk) return 0;
  blk.style[prop] = value;
  see(blk);
  return 1;
}

function setSize(px) {
  syncSel();
  var picked = saved && !saved.collapsed ? blocksOfRange(saved) : [];
  if (picked.length > 1) {
    for (var i = 0; i < picked.length; i++) picked[i].style.fontSize = px + 'px';
    reselect(picked);
    see(picked[0]);
    return 1;
  }
  if (!saved || saved.collapsed) return styleBlock('fontSize', px + 'px');
  var el = document.createElement('span');
  el.style.fontSize = px + 'px';
  el.appendChild(saved.extractContents());
  saved.insertNode(el);
  saved = document.createRange();
  saved.selectNodeContents(el);
  return 1;
}

function code() { return wrapTag('code'); }

function list(ordered) {
  syncSel();
  var blk = ensureBlock();
  if (!blk) return 0;
  var tag = ordered ? 'OL' : 'UL';
  if (blk.nodeName === 'LI') {
    var host = blk.parentNode;
    if (host.nodeName === tag) { // 再点一次取消列表
      var p = document.createElement('p');
      while (host.firstChild) {
        var li = host.firstChild;
        while (li.firstChild && /^(UL|OL)$/.test(li.firstChild.nodeName)) p.appendChild(li.firstChild);
        while (li.firstChild) p.appendChild(li.firstChild);
        if (p.lastChild && host.children.length > 1) p.appendChild(document.createElement('br'));
        host.removeChild(li);
      }
      host.parentNode.replaceChild(p, host);
      caretIn(p);
      return;
    }
    var neo = document.createElement(ordered ? 'ol' : 'ul');
    while (host.firstChild) neo.appendChild(host.firstChild);
    host.parentNode.replaceChild(neo, host);
    return;
  }
  var wrap = document.createElement(ordered ? 'ol' : 'ul');
  var item = document.createElement('li');
  while (blk.firstChild) item.appendChild(blk.firstChild);
  wrap.appendChild(item);
  blk.parentNode.replaceChild(wrap, blk);
  caretIn(item);
}

function currentLi() {
  var node = saved ? saved.startContainer : null;
  while (node && node !== document.body && node.nodeName !== 'LI') node = node.parentNode;
  return node && node.nodeName === 'LI' ? node : null;
}

function wrapTodo(li) {
  var box = document.createElement('input');
  box.type = 'checkbox';
  box.setAttribute('contenteditable', 'false');
  var span = document.createElement('span');
  span.className = 't';
  while (li.firstChild) span.appendChild(li.firstChild);
  li.setAttribute('data-done', '0');
  li.appendChild(box);
  li.appendChild(span);
}

function syncTodos() {
  var lis = document.querySelectorAll('ul.todo > li');
  for (var i = 0; i < lis.length; i++) {
    if (!lis[i].querySelector('input')) wrapTodo(lis[i]);
  }
}

function todo() {
  syncSel();
  var li = currentLi();
  if (li) {
    var ul = li.parentNode;
    if (ul.classList.contains('todo')) { // 再点一次就把勾选框撤掉，这一行的缩进/对齐跟着走
      lift(li);
      return 1;
    }
    ul.classList.add('todo');
    for (var i = 0; i < ul.children.length; i++) {
      if (!ul.children[i].querySelector('input')) wrapTodo(ul.children[i]);
    }
    return 1;
  }
  var blk = ensureBlock();
  var list = document.createElement('ul');
  list.className = 'todo';
  var item = document.createElement('li');
  while (blk.firstChild) item.appendChild(blk.firstChild);
  wrapTodo(item);
  list.appendChild(item);
  blk.parentNode.replaceChild(list, blk);
  caretIn(item.lastChild);
}

// 插入的东西跟在当前段落后面，落成单独一段
function insertAfter(node) {
  var blk = ensureBlock(), p = document.createElement('p');
  p.appendChild(node);
  blk.parentNode.insertBefore(p, blk.nextSibling);
}

function insertImage(path) {
  var img = document.createElement('img');
  img.src = path;
  insertAfter(img);
}

function insertLink(path, label) {
  if (/\.(m4a|mp3|aac|wav|ogg)$/i.test(path)) {
    var box = document.createElement('div');
    box.innerHTML = playerHtml(path, label);
    insertAfter(box.firstChild);
    return;
  }
  var a = document.createElement('a');
  a.href = path;
  a.textContent = label;
  insertAfter(a);
}

function insertText(text) {
  var blk = selBlock();
  if (!blk) {
    blk = document.createElement('p');
    document.body.appendChild(blk);
  }
  if (saved && blk.contains(saved.startContainer)) {
    saved.deleteContents();
    saved.insertNode(document.createTextNode(text));
  } else {
    blk.appendChild(document.createTextNode(text));
  }
}

function insertHr() {
  var blk = ensureBlock(), hr = document.createElement('hr');
  blk.parentNode.insertBefore(hr, blk.nextSibling);
}

function insertTable() {
  var cell = '<td><br></td><td><br></td>';
  insertAfter(document.createRange().createContextualFragment(
    '<table><tbody><tr>' + cell + '</tr><tr>' + cell + '</tr></tbody></table>').firstChild);
}

function blockOf(node) {
  while (node && node !== document.body && !/^(P|DIV|H1|H2|H3|BLOCKQUOTE|LI)$/.test(node.nodeName)) node = node.parentNode;
  return node && node !== document.body ? node : null;
}

function align(dir) { return styleBlock('textAlign', dir); }

function indent(delta) {
  syncSel();
  var blk = selBlock();
  if (!blk) return 0;
  var cur = parseInt(blk.style.marginLeft || '0', 10);
  blk.style.marginLeft = Math.max(0, cur + delta) + 'px';
  return 1;
}

snap();
document.body.addEventListener('input', function () {
  syncTodos();
  clearTimeout(pending);
  pending = setTimeout(snap, 400);
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t && t.type === 'checkbox' && t.parentNode && t.parentNode.nodeName === 'LI') {
    t.parentNode.setAttribute('data-done', t.checked ? '1' : '0');
  }
});
</script>
</html>
